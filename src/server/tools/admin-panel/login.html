<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel Admin — Acceso</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
    <form id="loginForm" class="login-form" autocomplete="on">
        <h1>Panel de Administración</h1>
        <p class="login-hint">Acceso restringido. Inicia sesión para continuar.</p>
        <label>Usuario
            <input id="username" name="username" autocomplete="username" required>
        </label>
        <label>Contraseña
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <div id="error" class="login-error"></div>
        <button type="submit">Entrar</button>
    </form>
    <script>
        (function () {
            const form = document.getElementById('loginForm');
            const error = document.getElementById('error');
            form.addEventListener('submit', async function (event) {
                event.preventDefault();
                error.textContent = '';
                const button = form.querySelector('button');
                button.disabled = true;
                try {
                    const response = await fetch('/api/admin/login', {
                        method: 'POST',
                        headers: { 'content-type': 'application/json' },
                        body: JSON.stringify({
                            username: document.getElementById('username').value,
                            password: document.getElementById('password').value
                        })
                    });
                    const data = await response.json().catch(function () { return {}; });
                    if (!response.ok) {
                        error.textContent = data.error || 'Credenciales inválidas';
                        return;
                    }
                    sessionStorage.setItem('admin_access', data.accessToken);
                    window.location.href = '/';
                } catch (err) {
                    error.textContent = 'Error de red: ' + err.message;
                } finally {
                    button.disabled = false;
                }
            });
        })();
    </script>
</body>
</html>
