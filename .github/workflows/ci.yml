name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/server/package-lock.json

      - name: Install server dependencies
        working-directory: src/server
        run: npm ci

      - name: Typecheck
        working-directory: src/server
        run: npm run typecheck

      - name: Build
        working-directory: src/server
        run: npm run build

      - name: Verify client patches
        working-directory: src/server
        run: npm run verify:client-patches
